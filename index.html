<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Valoris Capital Platform</title>
    <link rel="stylesheet" href="./shared/styles/platform-design-system.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="./index.html" aria-label="Valoris Capital Platform home">
          <div class="app-brand__mark" aria-hidden="true">V</div>
          <div class="app-brand__copy">
            <strong>VALORIS</strong>
            <span>Capital Platform</span>
          </div>
        </a>

        <div class="sidebar-group">
          <p class="sidebar-group__label">Navigation</p>
          <nav class="sidebar-nav" aria-label="Primary" id="primary-nav"></nav>
        </div>
      </aside>

      <div class="app-main">
        <header class="app-topbar">
          <div class="topbar-pill">Valoris Capital</div>
          <a class="btn btn--secondary" href="./README.md">Help</a>
          <div class="topbar-avatar" aria-hidden="true"></div>
        </header>

        <main class="page">
          <header class="page-header">
            <p class="eyebrow">Shared shell</p>
            <h1 class="page-title">Home</h1>
            <p class="page-subtitle">
              Use this landing page to jump into the product modules from one shared platform
              shell.
            </p>
          </header>

          <section class="page-controls" aria-label="Module controls">
            <div class="control-stack">
              <div class="control-row">
                <input
                  class="field"
                  id="module-search"
                  type="search"
                  placeholder="Search modules"
                  aria-label="Search modules"
                />
                <button class="btn btn--primary" id="module-reset" type="button">All modules</button>
              </div>
            </div>
          </section>

          <section class="card-grid" aria-label="Module cards" id="module-grid"></section>
        </main>
      </div>
    </div>

    <script>
      const modules = [
        {
          active: true,
          cta: 'Stay on Home',
          description:
            'Shared entry point for the platform. Keep the shell consistent and move straight into the module you need.',
          href: './index.html',
          label: 'Start here',
          name: 'Home',
        },
        {
          active: false,
          cta: 'Open Mortgage',
          description: 'Review debt, financing, and current loan position.',
          href: './modules/mortgage/views/index.html',
          label: 'Module',
          name: 'Mortgage',
        },
        {
          active: false,
          cta: 'Open Insurance',
          description: 'Track coverage, escrow, and policy activity.',
          href: './modules/insurance/views/insurance_command_center_oasis_trusted.html',
          label: 'Module',
          name: 'Insurance',
        },
        {
          active: false,
          cta: 'Open GP',
          description: 'See general partner structure and sponsor detail.',
          href: './modules/Gp/views/gp%20mockups.html',
          label: 'Module',
          name: 'GP',
        },
        {
          active: false,
          cta: 'Open Taxes',
          description: 'Review tax exposure, planning, and property-level detail.',
          href: './modules/taxes/views/index.html',
          label: 'Module',
          name: 'Taxes',
        },
      ];

      const nav = document.getElementById('primary-nav');
      const grid = document.getElementById('module-grid');
      const searchField = document.getElementById('module-search');
      const resetButton = document.getElementById('module-reset');

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => {
          switch (character) {
            case '&':
              return '&amp;';
            case '<':
              return '&lt;';
            case '>':
              return '&gt;';
            case '"':
              return '&quot;';
            case "'":
              return '&#39;';
            default:
              return character;
          }
        });
      }

      function renderNavigation() {
        nav.innerHTML = modules
          .map((module) => {
            const activeClass = module.active ? ' is-active' : '';
            const current = module.active ? ' aria-current="page"' : '';
            return `<a class="sidebar-link${activeClass}" href="${module.href}"${current}>${escapeHtml(module.name)}</a>`;
          })
          .join('');
      }

      function renderCards(filterText) {
        const term = filterText.trim().toLowerCase();
        const visibleModules = modules.filter((module) => {
          if (!term) {
            return true;
          }

          return (
            module.name.toLowerCase().includes(term) ||
            module.label.toLowerCase().includes(term) ||
            module.description.toLowerCase().includes(term)
          );
        });

        if (visibleModules.length === 0) {
          grid.innerHTML = `
            <article class="card shell-card">
              <p class="eyebrow">No results</p>
              <h2>No modules found</h2>
              <p class="text-muted">Clear the filter to return to the full module index.</p>
              <p><button class="btn btn--secondary" type="button" data-action="reset-modules">All modules</button></p>
            </article>
          `;
          return;
        }

        grid.innerHTML = visibleModules
          .map((module) => {
            const buttonClass = module.active ? 'btn btn--primary' : 'btn btn--secondary';
            return `
              <article class="card shell-card" data-module-name="${escapeHtml(module.name)}">
                <p class="eyebrow">${escapeHtml(module.label)}</p>
                <h2>${escapeHtml(module.name)}</h2>
                <p class="text-muted">${escapeHtml(module.description)}</p>
                <p><a class="${buttonClass}" href="${module.href}">${escapeHtml(module.cta)}</a></p>
              </article>
            `;
          })
          .join('');
      }

      function resetModules() {
        searchField.value = '';
        renderCards('');
        searchField.focus();
      }

      renderNavigation();
      renderCards('');

      searchField.addEventListener('input', () => {
        renderCards(searchField.value);
      });

      resetButton.addEventListener('click', resetModules);

      grid.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action="reset-modules"]');
        if (!target) {
          return;
        }

        resetModules();
      });
    </script>
  </body>
</html>
